<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0e0f11">
<title>Day - Athletic & Lean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap">
  <div class="hero" id="head"></div>
  <div id="fb"></div>
  <div class="timer" id="timerBox"></div>
  <div class="toggle" id="eqToggle" style="display:none">
    <button id="eqBody">Bodyweight only</button>
    <button id="eqFull">Dumbbells + pull-up bar</button>
  </div>
  <div id="content"></div>
  <div class="card" id="notesCard">
    <h2>Important notes</h2>
    <div id="notes"></div>
  </div>
  <div style="margin-top:16px"><a href="index.html" class="btn ghost small">&larr; Back to home</a></div>
</div>

<script src="app.js"></script>
<script>
(function(){
  var S = FT.load();
  document.getElementById("nav").innerHTML = FT.nav("");
  var params = new URLSearchParams(location.search);
  var key = params.get("day") || FT.todayDayKey();
  if(!FT.PLAN[key]) key = FT.todayDayKey();
  var p = FT.PLAN[key];
  var wk = FT.weekKey();
  document.title = p.name+" - Athletic & Lean";

  document.getElementById("head").innerHTML =
    '<h1>'+FT.esc(p.name)+' - <em>'+FT.esc(p.title)+'</em></h1>'+
    '<p>'+FT.esc(p.sub)+'</p>';

  // notes
  document.getElementById("notes").innerHTML = FT.NOTES.map(function(n){
    return '<div class="notebox"><b>'+FT.esc(n.t)+':</b> '+FT.esc(n.d)+'</div>';
  }).join("");
  if(p.type==="rest" || p.type==="cycle"){
    document.getElementById("notesCard").style.display="none";
  }

  // football swap
  function renderFb(){
    var on = !!S.football[wk+"|"+key];
    document.getElementById("fb").innerHTML =
      '<button class="btn ghost" id="fbBtn">'+(on?'✓ Football match counted - tap to undo':'Football match today? Let the game count')+'</button>';
    document.getElementById("fbBtn").onclick = function(){
      if(S.football[wk+"|"+key]) delete S.football[wk+"|"+key];
      else S.football[wk+"|"+key]=true;
      FT.save(S); renderFb(); renderContent();
    };
    if(on) document.getElementById("content").innerHTML =
      '<div class="notebox">Football day - the match replaces this workout. Tick nothing, enjoy the game.</div>';
  }

  // timer (time tracking)
  var tickInt = null;
  function isRunning(){ return S.activeSession && S.activeSession.day===key && S.activeSession.date===FT.todayStr(); }
  function anyRunning(){ return !!S.activeSession; }
  function renderTimer(){
    var box = document.getElementById("timerBox");
    var running = isRunning();
    var todayTotal = 0;
    S.sessions.forEach(function(s){ if(s.date===FT.todayStr() && s.day===key) todayTotal += s.seconds; });
    var elapsed = running ? (Date.now()-S.activeSession.startTs)/1000 : 0;
    box.innerHTML =
      '<div class="clock" id="clock">'+FT.fmtClock(elapsed)+'</div>'+
      '<div class="lbl">'+(running?"session running":"session timer")+(todayTotal?(' · done today: '+FT.fmtDur(todayTotal)):'')+'</div>'+
      '<div class="row">'+
        (running
          ? '<button class="btn green" id="finishBtn">Finish session</button>'
          : '<button class="btn" id="startBtn">'+(anyRunning()?'Restart timer here (stops the other session)':'Start session')+'</button>')+
      '</div>';
    if(running){
      document.getElementById("finishBtn").onclick = finish;
      tickInt = setInterval(function(){
        var c = document.getElementById("clock");
        if(c) c.textContent = FT.fmtClock((Date.now()-S.activeSession.startTs)/1000);
      },1000);
    } else {
      document.getElementById("startBtn").onclick = start;
    }
  }
  function start(){
    if(anyRunning()) closeActive();
    S.activeSession = {day:key, date:FT.todayStr(), startTs:Date.now()};
    FT.save(S); clearInterval(tickInt); renderTimer();
  }
  function closeActive(){
    if(!S.activeSession) return;
    var secs = Math.max(1, Math.round((Date.now()-S.activeSession.startTs)/1000));
    S.sessions.push({date:S.activeSession.date, day:S.activeSession.day, seconds:secs, ts:Date.now()});
    S.activeSession = null;
  }
  function finish(){
    closeActive();
    FT.save(S); clearInterval(tickInt); renderTimer();
  }

  // equipment toggle on workout days
  if(p.type==="workout"){
    var t = document.getElementById("eqToggle");
    t.style.display="flex";
    function paintEq(){
      document.getElementById("eqBody").className = S.equipment ? "" : "on";
      document.getElementById("eqFull").className = S.equipment ? "on" : "";
    }
    document.getElementById("eqBody").onclick = function(){ S.equipment=false; FT.save(S); paintEq(); renderContent(); };
    document.getElementById("eqFull").onclick = function(){ S.equipment=true; FT.save(S); paintEq(); renderContent(); };
    paintEq();
  }

  function tickKey(id){ return wk+"|"+key+"|"+id; }

  function renderContent(){
    if(S.football[wk+"|"+key]) return; // football note already shown
    var c = document.getElementById("content");
    if(p.type==="workout"){
      var list = S.equipment ? p.equip : p.body;
      var note = S.equipment ? p.circuitNote : (p.circuitNoteBody || p.circuitNote);
      var html = note ? '<div class="notebox">'+FT.esc(note)+'</div>' : '';
      var lastGroup = null;
      list.forEach(function(e){
        if(e.group && e.group!==lastGroup){ html += '<div class="grouphead">'+FT.esc(e.group)+'</div>'; }
        if(e.group) lastGroup = e.group;
        var done = !!S.ticks[tickKey(e.id)];
        html += '<div class="ex'+(done?' done':'')+'" data-id="'+e.id+'">'+
          '<div class="ex-head">'+
            '<button class="ex-check" data-tick="'+e.id+'">✓</button>'+
            '<div><div class="ex-name">'+FT.esc(e.name)+'</div>'+
            '<div class="ex-meta"><span class="tag dose">'+FT.esc(e.dose)+'</span><span class="tag">'+FT.esc(e.muscle)+'</span></div></div>'+
          '</div>'+
          '<ul class="ex-steps" id="steps-'+e.id+'">'+ e.steps.map(function(s){return '<li>'+FT.esc(s)+'</li>';}).join("") +'</ul>'+
          '<div class="ex-actions">'+
            '<button class="mini" data-steps="'+e.id+'">How to do it</button>'+
            e.vids.map(function(v,i){ return '<button class="mini vid" data-vid="'+e.id+'-'+i+'">'+FT.esc(v.label)+'</button>'; }).join("")+
          '</div>'+
          e.vids.map(function(v,i){
            return '<div class="vidbox" id="vid-'+e.id+'-'+i+'">'+
              '<div class="vidframe"><iframe data-src="https://www.youtube-nocookie.com/embed/'+v.id+'" title="'+FT.esc(e.name)+' form video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>'+
              '<a class="vidlink" href="https://www.youtube.com/watch?v='+v.id+'" target="_blank" rel="noopener">Open in YouTube</a>'+
            '</div>';
          }).join("")+
        '</div>';
      });
      c.innerHTML = html;
    } else {
      var h2 = '';
      p.items.forEach(function(it){
        var done = !!S.ticks[tickKey(it.id)];
        h2 += '<div class="tickitem'+(done?' done':'')+'">'+
          '<button class="ex-check" data-tick="'+it.id+'">✓</button>'+
          '<div><div class="txt">'+FT.esc(it.text)+'</div>'+(it.hint?'<div class="hint">'+FT.esc(it.hint)+'</div>':'')+'</div>'+
        '</div>';
      });
      c.innerHTML = h2;
    }

    // wire ticks
    c.querySelectorAll("[data-tick]").forEach(function(b){
      b.onclick = function(){
        var k = tickKey(b.getAttribute("data-tick"));
        if(S.ticks[k]) delete S.ticks[k]; else S.ticks[k]=true;
        FT.save(S); renderContent();
      };
    });
    // wire step toggles
    c.querySelectorAll("[data-steps]").forEach(function(b){
      b.onclick = function(){
        var el = document.getElementById("steps-"+b.getAttribute("data-steps"));
        el.classList.toggle("open");
      };
    });
    // wire video toggles (lazy-load iframe)
    c.querySelectorAll("[data-vid]").forEach(function(b){
      b.onclick = function(){
        var el = document.getElementById("vid-"+b.getAttribute("data-vid"));
        var f = el.querySelector("iframe");
        if(f && !f.src) f.src = f.getAttribute("data-src");
        el.classList.toggle("open");
      };
    });
  }

  renderFb();
  renderTimer();
  renderContent();
})();
</script>
</body>
</html>
