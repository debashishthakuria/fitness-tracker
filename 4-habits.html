<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0d0f14">
<title>Habits - Athletic & Lean</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<div class="wrap">
  <div class="hero">
    <h1>Daily <em>habits</em></h1>
    <p>Five boxes, every day. They reset at midnight - a full day keeps your streak alive.</p>
  </div>

  <div class="statgrid">
    <div class="stat"><div class="n" id="stToday">0/5</div><div class="l">today</div></div>
    <div class="stat"><div class="n" id="stStreak">0</div><div class="l">day streak</div></div>
    <div class="stat"><div class="n" id="stWeek">0</div><div class="l">full days this week</div></div>
  </div>

  <div class="sec-title">Today's checklist</div>
  <div id="habits"></div>

  <div class="foot">Sleep before midnight keeps hunger hormones and cravings down.</div>
</div>

<script src="app.js"></script>
<script>
(function(){
  var S = FT.load();
  document.getElementById("nav").innerHTML = FT.nav("habits");
  var today = FT.todayStr();

  function doneOn(dateStr){
    var n=0;
    FT.HABITS.forEach(function(h){ if(S.habits[dateStr+"|"+h.id]) n++; });
    return n;
  }
  function shift(dateStr, delta){
    var p = dateStr.split("-");
    var d = new Date(+p[0], +p[1]-1, +p[2]);
    d.setDate(d.getDate()+delta);
    return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
  }

  function render(){
    var html = "";
    FT.HABITS.forEach(function(h){
      var k = today+"|"+h.id;
      var done = !!S.habits[k];
      html += '<div class="tickitem'+(done?' done':'')+'">'+
        '<button class="ex-check" data-h="'+h.id+'">✓</button>'+
        '<div class="txt">'+FT.esc(h.text)+'</div></div>';
    });
    document.getElementById("habits").innerHTML = html;
    document.querySelectorAll("[data-h]").forEach(function(b){
      b.onclick = function(){
        var k = today+"|"+b.getAttribute("data-h");
        if(S.habits[k]) delete S.habits[k]; else S.habits[k]=true;
        FT.save(S); render();
      };
    });

    document.getElementById("stToday").textContent = doneOn(today)+"/5";
    // streak: consecutive full days ending today (or yesterday if today not full yet)
    var streak = 0, d = today;
    if(doneOn(d) < 5) d = shift(d,-1);
    while(doneOn(d) === 5){ streak++; d = shift(d,-1); }
    document.getElementById("stStreak").textContent = streak;
    // full days this week (Mon-Sun of current week is fine; use last 7 days ending today)
    var full = 0;
    for(var i=0;i<7;i++){ if(doneOn(shift(today,-i))===5) full++; }
    document.getElementById("stWeek").textContent = full;
  }
  render();
})();
</script>
</body>
</html>
